# Copy the whole repository when using this local external-component path.
# GPIOs are the carrier v0.1 assignment; verify your actual boards before wiring.
substitutions:
  node_name: harf-01
  friendly_name: HARF 01
  rf_cs: GPIO4
  rf_sck: GPIO6
  rf_mosi: GPIO10
  rf_miso: GPIO7
  rf_tx: GPIO3
  rf_rx: GPIO1

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [magicband]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${node_name} Setup
    password: !secret fallback_password

captive_portal:
logger:
  baud_rate: 0
api:
  encryption:
    key: !secret api_key
  custom_services: true
  homeassistant_services: true
ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: ${rf_sck}
  mosi_pin: ${rf_mosi}
  miso_pin: ${rf_miso}

cc1101:
  id: radio
  cs_pin: ${rf_cs}
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  output_power: 10

globals:
  - id: last_capture
    type: uint32_t
    initial_value: '0'
  - id: rf_transmitting
    type: bool
    initial_value: 'false'

remote_transmitter:
  id: rf_transmitter
  pin: ${rf_tx}
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    - lambda: id(rf_transmitting) = true;
    - cc1101.begin_tx: radio
  on_complete:
    - cc1101.begin_rx: radio
    - lambda: id(rf_transmitting) = false;

remote_receiver:
  id: rf_receiver
  pin: ${rf_rx}
  tolerance: 25%
  filter: 100us
  idle: 8ms
  buffer_size: 8kb
  on_raw:
    then:
      - if:
          condition:
            lambda: |-
              if (id(rf_transmitting) || x.size() < 6 || x.size() > 1024 || millis() - id(last_capture) < 200) return false;
              id(last_capture) = millis();
              return true;
          then:
            - homeassistant.event:
                event: esphome.harf_received
                data:
                  node: ${node_name}
                  frequency: '433920000'
                  timings: !lambda |-
                    std::string result;
                    for (auto pulse : x) {
                      if (!result.empty()) result += ',';
                      result += std::to_string(pulse);
                    }
                    return result;

radio_frequency:
  - platform: ir_rf_proxy
    name: RF Transmitter
    id: rf_proxy_tx
    frequency: 433.92MHz
    remote_transmitter_id: rf_transmitter
  - platform: ir_rf_proxy
    name: RF Receiver
    frequency: 433.92MHz
    remote_receiver_id: rf_receiver

# BLE advertising is owned exclusively by the MagicBand component in v0.1.
esp32_ble:
  id: ble_stack
  advertising: false
magicband:
  id: magicband_controller
  ble_id: ble_stack

switch:
  - platform: template
    name: MagicBand Enabled
    id: magicband_enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(magicband_controller).set_enabled(true);
    turn_off_action:
      - lambda: id(magicband_controller).set_enabled(false);

button:
  - platform: restart
    name: Restart
  - platform: template
    name: Stop MagicBand Broadcast
    on_press:
      - lambda: id(magicband_controller).request("", 100, false, true);

binary_sensor:
  - platform: status
    name: Connected
  - platform: template
    name: MagicBand Broadcasting
    lambda: return id(magicband_controller).is_broadcasting();
sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
